<svg width="400" height="400" viewBox="110 100 180 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9c27b0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e91e63;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 中心数据库图标 -->
  <g transform="translate(200, 200)">
    <!-- 数据库主体 - 三层结构 -->
    <!-- 第一层 -->
    <ellipse cx="0" cy="-50" rx="60" ry="20" fill="#64b5f6" />
    <path d="M-60 -50 v40 c0 11 26.9 20 60 20 s60 -9 60 -20 v-40" fill="url(#dbGradient)" />
    <ellipse cx="0" cy="-50" rx="60" ry="20" fill="#90caf9" opacity="0.5" />
    
    <!-- 第二层 -->
    <path d="M-60 -10 v40 c0 11 26.9 20 60 20 s60 -9 60 -20 v-40" fill="url(#dbGradient)" opacity="0.85" />
    <ellipse cx="0" cy="-10" rx="60" ry="20" fill="none" stroke="#1565c0" stroke-width="2" opacity="0.3" />
    
    <!-- 第三层 -->
    <path d="M-60 30 v40 c0 11 26.9 20 60 20 s60 -9 60 -20 v-40" fill="url(#dbGradient)" opacity="0.7" />
    <ellipse cx="0" cy="30" rx="60" ry="20" fill="none" stroke="#1565c0" stroke-width="2" opacity="0.3" />
    
    <!-- 数据元素点缀 -->
    <g fill="#ffffff" opacity="0.6">
      <circle cx="-25" cy="-40" r="4" />
      <circle cx="-25" cy="-15" r="4" />
      <circle cx="-25" cy="10" r="4" />
      <circle cx="25" cy="-40" r="4" />
      <circle cx="25" cy="-15" r="4" />
      <circle cx="25" cy="10" r="4" />
      <circle cx="0" cy="-25" r="3" />
      <circle cx="0" cy="0" r="3" />
      <circle cx="0" cy="25" r="3" />
    </g>
  </g>
  
  <!-- 环绕箭头 - 表示循环迁移 -->
  <g fill="none" stroke="url(#arrowGradient)" stroke-width="6" stroke-linecap="round">
    <!-- 上方箭头 -->
    <path d="M150 120 Q200 90 250 120" />
    <polygon points="250,120 240,105 245,125" fill="url(#arrowGradient)" stroke="none" />
    
    <!-- 右侧箭头 -->
    <path d="M280 150 Q310 200 280 250" />
    <polygon points="280,250 295,240 275,245" fill="url(#arrowGradient)" stroke="none" />
    
    <!-- 下方箭头 -->
    <path d="M250 280 Q200 310 150 280" />
    <polygon points="150,280 160,295 155,275" fill="url(#arrowGradient)" stroke="none" />
    
    <!-- 左侧箭头 -->
    <path d="M120 250 Q90 200 120 150" />
    <polygon points="120,150 105,160 125,155" fill="url(#arrowGradient)" stroke="none" />
  </g>
  
  <!-- 流动数据粒子 -->
  <circle cx="170" cy="110" r="5" fill="#00bcd4" opacity="0.8">
    <animate attributeName="cx" values="170;230" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="110;110" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="290" cy="170" r="5" fill="#e91e63" opacity="0.8">
    <animate attributeName="cx" values="290;290" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="170;230" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="230" cy="290" r="5" fill="#00bcd4" opacity="0.8">
    <animate attributeName="cx" values="230;170" dur="1.5s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="290;290" dur="1.5s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="110" cy="230" r="5" fill="#e91e63" opacity="0.8">
    <animate attributeName="cx" values="110;110" dur="1.5s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="230;170" dur="1.5s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>