# 前端托管 + API 同源反代（v2.4.4）
# 前端请求走相对路径（VITE_API_BASE_URL 为空），由本配置反代到后端 web 服务，
# 浏览器视角全程同源，无 CORS 需求。

server {
    listen 80;
    server_name _;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 前端静态资源（Vite 构建产物，带 hash 可长缓存）
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代 → compose 内 web 服务（gunicorn）
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大对象迁移相关接口耗时较长
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }

    # Django admin 静态与页面的反代（可选）
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
    }
    location /static/ {
        proxy_pass http://web:8000;
    }

    # WebSocket 反代（监控/日志实时推送，若启用）
    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 健康检查直通后端
    location = /healthz {
        proxy_pass http://web:8000/healthz;
    }
}
