name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: '是否发布到 GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install and build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build:tauri
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  build-tauri:
    needs: frontend-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            bundles: 'dmg,app'
            label: 'macos-universal'
          - platform: ubuntu-22.04
            args: ''
            bundles: 'deb,rpm,appimage'
            label: 'linux-x64'
          - platform: windows-latest
            args: ''
            bundles: 'nsis,msi'
            label: 'windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Prepare backend resources
        shell: bash
        run: |
          RES_DIR="src-tauri/resources/backend"
          mkdir -p "$RES_DIR"
          cp manage.py "$RES_DIR/" 2>/dev/null || true
          cp requirements.txt "$RES_DIR/" 2>/dev/null || true
          for d in migration_app oracle2polardb_pg staticfiles; do
            if [ -d "$d" ]; then
              mkdir -p "$RES_DIR/$d"
              rsync -a --delete --exclude='__pycache__' --exclude='*.pyc' "$d/" "$RES_DIR/$d/" 2>/dev/null || cp -r "$d" "$RES_DIR/"
            fi
          done
          cat > "$RES_DIR/.env.production" <<'EOF'
          DJANGO_DEBUG=False
          DJANGO_SECRET_KEY=desktop-local-please-change-in-production
          DATABASE_URL=sqlite:///oracle2polardb_desktop.db
          ALLOWED_HOSTS=127.0.0.1,localhost
          EOF

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Tauri app
        run: cargo tauri build ${{ matrix.args }} --bundles ${{ matrix.bundles }}
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE_SECRET }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: |
            src-tauri/target*/release/bundle/**/*.dmg
            src-tauri/target*/release/bundle/**/*.app
            src-tauri/target*/release/bundle/**/*.deb
            src-tauri/target*/release/bundle/**/*.rpm
            src-tauri/target*/release/bundle/**/*.AppImage
            src-tauri/target*/release/bundle/**/*.msi
            src-tauri/target*/release/bundle/**/*.exe
            src-tauri/target*/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: build-tauri
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 桌面客户端 ${{ github.ref_name }}
          body: |
            # Oracle2PolarDB 桌面客户端 ${{ github.ref_name }}

            ## 下载说明
            - Windows: 下载 .msi 或 .exe 安装包
            - macOS: 下载 .dmg(通用二进制,Intel + Apple Silicon)
            - Linux: .deb / .rpm / .AppImage

            ## 系统要求
            - Windows 10/11 (x64)
            - macOS 10.15+
            - Ubuntu 20.04+ / Debian 11+ / CentOS 8+
            - Python 3.12+
          files: |
            artifacts/desktop-macos-universal/**/*.dmg
            artifacts/desktop-macos-universal/**/*.app
            artifacts/desktop-linux-x64/**/*.deb
            artifacts/desktop-linux-x64/**/*.rpm
            artifacts/desktop-linux-x64/**/*.AppImage
            artifacts/desktop-windows-x64/**/*.msi
            artifacts/desktop-windows-x64/**/*.exe
          draft: false
          prerelease: false
