name: Docker Build

# v2.4: 推送 master 或打 v* 标签时自动构建 Docker 镜像并推送到 GHCR(GitHub Container Registry)
# 镜像地址: ghcr.io/<owner>/<repo>:<tag>
# 常见标签: latest(master 推送时)、sha-<git短sha>、v1.0.0(打 tag 时)
#
# v2.5: 改为 thin/thick 双变体矩阵，并可选同步推送到阿里云 ACR——
#   · thin  → :latest 等基础标签（python-oracledb thin，连不了 11g 源库）
#   · thick → 同名标签加 -thick 后缀（含 Instant Client 19.32，面向 11.2.0.4 这类老源库）
#   · 步骤顺序固定为 GHCR 推送 → 真容器冒烟 → 冒烟标记 → ACR 镜像同步；
#     ACR 只在配了 ALIYUN_REGISTRY_USER / ALIYUN_REGISTRY_PASSWORD 时执行，且失败不阻断，
#     因为凭证填错不该把"镜像能不能跑"的证据一起抹掉。
#   口令只放仓库 Secrets，绝不出现在代码或日志里。
#
# v2.6: 开发机到 GitHub 的 HTTPS 被中间设备重置，读不到 Actions 日志，因此让流水线
#   自己把结果写进 GHCR 标签：smoke-<变体> = 冒烟全绿，ci-<sha8>-<变体>-<步骤> = 该步失败。
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  # 阿里云容器镜像服务(个人版)的命名空间/仓库名，必须先在控制台创建好，
  # 否则 push 报 NAME_UNKNOWN / denied
  ACR_NAMESPACE_REPO: hayrat/oracle2polardb_pg

jobs:
  docker:
    runs-on: ubuntu-latest
    # 两个变体各自独立成败，一个挂了不影响另一个
    strategy:
      fail-fast: false
      matrix:
        include:
          # thin 用基础标签(latest 等)，thick 通过 flavor 的 suffix 给每个标签加 -thick
          # 注意 suffix 是 metadata-action 的 flavor 属性，不是顶层 input；
          # onlatest=true 才让 latest 也变成 latest-thick
          - target: thin
            flavor: ''
          - target: thick
            flavor: 'suffix=-thick,onlatest=true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        id: ghcrlogin
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ACR 的登录/推送刻意挪到 GHCR 冒烟之后（见下面的 acr-mirror 步骤），
      # 原因很具体：上一轮把 Login to Aliyun ACR 放在构建之前，只要固定密码或用户名
      # 填错，thin 和 thick 两条腿都会在"任何镜像推出之前"整轮终止 —— 于是既没有镜像，
      # 也没有任何可以从外部匿名查到的失败线索。挪到后面之后，阿里云凭证错误只会让
      # acr-mirror 这一步红，GHCR 侧的镜像和冒烟证据照样能拿到。

      - name: Detect optional registries
        id: flags
        env:
          # 官方文档明确：if 条件里不能引用 secrets —— 会被文件校验直接拒绝，
          # 整个 run 一步都不执行（上一轮就是这么"零标签"静默死的）。
          # 这里只用文档示例给出的形式把 secrets 放进步骤级 env，判断挪进 shell，
          # 结论以 output 形式供后面的 if 使用；env 里只判断真假，不回显值本身。
          ACR_PASSWORD_PRESENT: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          set -u
          if [ -n "${ACR_PASSWORD_PRESENT}" ]; then
            echo "acr_enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "acr_enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      # 只要这个标签出现，就证明 workflow 通过了校验、job 真的分到了 runner。
      # 它把"零标签"的两种解释分开：文件被拒/未触发（无 started）对比 构建阶段失败（有 started）。
      # latest 此刻还是上一轮的镜像，指向它不影响结论——证据全在标签名里。
      - name: Publish run-started marker
        id: started
        continue-on-error: true
        run: |
          set -uo pipefail
          docker buildx imagetools create \
            -t "ghcr.io/${GITHUB_REPOSITORY}:ci-${GITHUB_SHA::8}-${{ matrix.target }}-started" \
            "ghcr.io/${GITHUB_REPOSITORY}:latest"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 只对 GHCR 生成标签；ACR 用同一批标签在镜像落地后改名推送，
          # 因此不再有"元数据库里配了 ACR 就必须能用"的隐藏耦合。
          # 镜像名自动转小写(GHCR 要求小写)
          images: ghcr.io/${{ github.repository }}
          flavor: ${{ matrix.flavor }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 每个变体一份缓存，否则两个 target 会互相把对方的层顶掉
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      # 运行期冒烟：开发机是 arm64 且没有容器引擎，镜像（amd64）只在 CI 才可能真正跑起来，
      # 所以"打包成功 + 运行正常"必须在这里用真容器证明，而不是靠读 Dockerfile 推断。
      - name: Smoke test the pushed image
        id: smoke
        env:
          # 按 digest 定位而不是按 tag：同一轮里 latest 会被上一轮覆盖，tag 无法证明"就是刚推的那份"
          DIGEST: ${{ steps.build.outputs.digest }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          name="smoke-${{ matrix.target }}"
          img="${GHCR_IMAGE}@${DIGEST}"
          if [ -z "${DIGEST}" ]; then echo "::error::build-push 未输出 digest，无法定位刚推的镜像"; exit 1; fi
          docker pull -q "${img}" >/dev/null

          # 一次性密钥，只为通过 settings.py 的 prod 强制校验（SECRET_KEY/FERNET/ALLOWED_HOSTS），
          # 不写进任何镜像层，也不参与真实连接口令的加解密。
          fkey=$(docker run --rm "${img}" python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          docker run -d --name "${name}" -p 8000:8000 \
            -e DJANGO_ENV=prod -e DJANGO_DEBUG=false \
            -e DJANGO_SECRET_KEY=smoke-throwaway-key-not-a-real-secret \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e MIGRATION_FERNET_KEY="${fkey}" \
            -e SECURE_SSL_REDIRECT=false \
            "${img}" >/dev/null
          # 失败时把容器日志打到 step 输出，否则只能看到 curl 的非零退出码
          onfail() { echo "--- container logs ---"; docker logs --tail 200 "${name}" 2>&1 || true; }
          trap onfail ERR

          for i in $(seq 1 30); do
            curl -fsS -m 5 -o /dev/null http://127.0.0.1:8000/healthz && break
            [ "$i" = 30 ] && { echo "::error::容器 60s 内未响应 /healthz"; onfail; exit 1; }
            sleep 2
          done

          check() { # check <名字> <期望状态码> <URL> [必须命中的字符串]
            local body code
            body="$(mktemp)"
            code="$(curl -s -m 10 -o "${body}" -w '%{http_code}' "$3")"
            [ "${code}" = "$2" ] || { echo "::error::$1 期望 HTTP $2，实际 $code"; head -c 400 "${body}"; echo; onfail; exit 1; }
            [ -z "${4:-}" ] || grep -q "$4" "${body}" || { echo "::error::$1 响应体缺少 '$4'"; head -c 400 "${body}"; echo; exit 1; }
            echo "OK  $1  $3 -> $code"
            rm -f "${body}"
          }

          check "存活探针"        200 http://127.0.0.1:8000/healthz  '"status"'
          # 首页来自镜像里的 frontend/dist（WhiteNoise 的 WHITENOISE_ROOT 按原路径直出）
          check "根路由返回首页"  200 http://127.0.0.1:8000/         'id="app"'
          check "SPA 深层路由回退" 200 http://127.0.0.1:8000/oracle   'id="app"'
          # 打错的 /api 必须还是 404，否则前端只会拿到"200 但 JSON 解析失败"
          check "API 前缀不被回退吞掉" 404 http://127.0.0.1:8000/api/definitely-not-a-route
          check "就绪探针返回 JSON" 200 http://127.0.0.1:8000/readyz  '"status"'

          # /assets/ 是前端构建产物的真实文件名，逐个验证清单太贵，抽 index.html 里第一个 js 入口
          # || true：pipefail 下 grep 无命中会直接终止脚本，那样下面的针对性报错就跑不到了
          asset=$(curl -s http://127.0.0.1:8000/ | grep -oE '/assets/[^"]+\.js' | head -1 || true)
          [ -n "${asset}" ] || { echo "::error::首页里没有 /assets/ 引用，前端产物可能没进镜像"; onfail; exit 1; }
          check "静态资源可访问"  200 "http://127.0.0.1:8000${asset}"

          # 探针 Host 豁免（probe_host.py）：ALLOWED_HOSTS 之外的 Host 打探针要能 200，
          # 打真实页面必须仍然 400 —— 一起断言才证明豁免是窄的，不是把 Host 校验整块放宽了
          probe_code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: probe-only.invalid' http://127.0.0.1:8000/healthz)
          [ "${probe_code}" = 200 ] || { echo "::error::/healthz 未知 Host 期望 200，实际 ${probe_code}（豁免未生效？）"; onfail; exit 1; }
          root_code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: probe-only.invalid' http://127.0.0.1:8000/)
          [ "${root_code}" = 400 ] || { echo "::error::首页未知 Host 期望 400，实际 ${root_code}（Host 校验被放宽）"; onfail; exit 1; }
          echo "OK  探针豁免窄  /healthz=200  /=400"

          if [ "${{ matrix.target }}" = "thick" ]; then
            # 运行时再加载一次客户端库：Dockerfile 的构建期断言只证明"当时能加载"，
            # 换到运行用户/环境变量下仍可能缺依赖（libaio、LD_LIBRARY_PATH 未继承）
            docker run --rm "${img}" python -c \
              "import oracledb; oracledb.init_oracle_client(lib_dir='/usr/lib/oracle/19.32/client64/lib'); print('thick runtime OK', oracledb.clientversion()[:3])"
          fi

      # 冒烟全绿的镜像先打一个公开可查的标记，再动阿里云：
      # 顺序反过来的话，一次凭证错误就可能让我们连"镜像到底能不能跑"都无法证实。
      - name: Publish smoke marker
        id: marker
        if: success()
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="ghcr.io/${GITHUB_REPOSITORY}"
          src="${ref}@${DIGEST}"
          dst="${ref}:smoke-${{ matrix.target }}"
          # 用 registry 侧复制，而不是 pull+tag+push：后者会经过本地镜像存储重新序列化
          # manifest，上一轮就出现 smoke-thin 与 master-<sha> digest 不一致（内容相同但
          # 无法自证同源）。imagetools create 原样搬运 manifest，digest 保持不变，
          # 于是在外面比对两个标签的 digest 就能证明"冒烟跑的就是这一轮的镜像"。
          docker buildx imagetools create -t "${dst}" "${src}"
          echo "冒烟标记: ${dst}"

      # 阿里云 ACR 个人版：用户名是"账号全名"（控制台右上角头像下的登录名），
      # 密码必须是"容器镜像服务 → 访问凭证 → 固定密码"，用阿里云登录密码会直接 401。
      - name: Mirror image to Aliyun ACR
        id: acr
        # 用 flags 的 output 判断，不在 if 里碰 secrets
        if: ${{ steps.smoke.outcome == 'success' && steps.flags.outputs.acr_enabled == 'true' }}
        continue-on-error: true
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ACR_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # workflow 级 env 在 run 里就是普通 shell 变量，不必用表达式去引用 env 上下文
          # （step 级 env 能否引用 env 上下文文档未列明，不赌；注意 run 脚本里的表达式
          #   会被 GitHub 先替换，所以注释里也不要出现表达式字面量）
          acr_image="${ACR_REGISTRY}/${ACR_NAMESPACE_REPO}"
          src="ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
          # 密码走 stdin：写在命令行参数里的值会原样出现在日志中
          printf '%s' "${ACR_PASSWORD}" | docker login "${ACR_REGISTRY}" -u "${ACR_USER}" --password-stdin
          docker pull -q "${src}" >/dev/null
          first=""
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            dst="${acr_image}:${tag##*:}"
            docker tag "${src}" "${dst}"
            # 不用 docker push -q：quiet 在部分 CLI 版本里不存在，省掉它并把 stdout 丢弃即可
            docker push "${dst}" >/dev/null
            [ -n "${first}" ] || first="${dst}"
            echo "OK  已推送 ${dst}"
          done <<< "${TAGS}"
          [ -n "${first}" ] || { echo "::error::metadata 没有产出任何标签，无从推送"; exit 1; }
          # 回读一遍证明"阿里云侧真能拉到"。digest 只做记录不做断言：
          # 客户端在不同 registry 间可能重新序列化 manifest，据此失败会把可用镜像误报成不可用。
          docker pull -q "${first}" >/dev/null
          echo "ACR 回读成功 ${first}; GHCR 本轮 digest ${DIGEST}"

      # 开发机读不到 Actions 日志，所以让流水线自己把"挂在哪一步"写成 GHCR 标签。
      # 标签名就是证据：ci-<sha>-<变体>-<失败步骤>，匿名 tags/list 可查。
      - name: Publish diagnostic markers
        id: diag
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -uo pipefail
          ref="ghcr.io/${GITHUB_REPOSITORY}"
          # build 之前就失败时拿不到本轮 digest，退化成引用已存在的 latest：
          # 标记的价值全在标签名上，它指向哪份 manifest 无关紧要。
          src="${ref}:latest"
          [ -n "${DIGEST}" ] && src="${ref}@${DIGEST}"
          # imagetools 直接在 registry 之间复制 manifest，不必把镜像拉到本地再推
          mark() {
            local tag="${ref}:ci-${GITHUB_SHA::8}-${{ matrix.target }}-$1"
            docker buildx imagetools create -t "${tag}" "${src}" >/dev/null && echo "失败标记 ${tag}"
          }
          outcomes=""
          outcomes="${outcomes} login-ghcr:${{ steps.ghcrlogin.outcome }}"
          outcomes="${outcomes} extract-metadata:${{ steps.meta.outcome }}"
          outcomes="${outcomes} build-push:${{ steps.build.outcome }}"
          outcomes="${outcomes} smoke-test:${{ steps.smoke.outcome }}"
          outcomes="${outcomes} smoke-marker:${{ steps.marker.outcome }}"
          outcomes="${outcomes} acr-mirror:${{ steps.acr.outcome }}"
          echo "本轮步骤结果: ${outcomes}"
          markers=0
          for item in ${outcomes}; do
            if [ "${item##*:}" = "failure" ]; then mark "${item%%:*}"; markers=$((markers + 1)); fi
          done
          [ "${markers}" -gt 0 ] || echo "无失败步骤，未打标记"
