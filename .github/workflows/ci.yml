name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: "false"
          ORACLE_CLIENT_LIB: ""

      - name: Run tests
        run: python manage.py test migration_app.tests -v 2
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: "false"
          ORACLE_CLIENT_LIB: ""

      - name: Install security linter
        run: pip install bandit

      - name: Run bandit security scan
        # v2.4: 静态扫描安全问题(medium 及以上),防新增高危代码
        # 跳过说明:
        #   B105=硬编码密码(测试用密码误报)
        #   B311=random(非密码学用途的 random 误报)
        #   B608=SQL 注入(本项目大量合法 SQL 拼接已用 safe_oracle_identifier/
        #         quote_identifier 保护,bandit 不识别安全函数会误报;
        #         SQL 注入防护靠 serializer 入口校验 + 运行时安全函数双重保障)
        run: bandit -r migration_app -x 'tests.py,migrations' -ll -s B105,B311,B608

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
