name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: "false"
          ORACLE_CLIENT_LIB: ""

      - name: Run tests
        run: python manage.py test migration_app.tests -v 2
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: "false"
          ORACLE_CLIENT_LIB: ""
          # settings.py 把 SSL 跳转挂在 `if not DEBUG` 上，默认 true。测试客户端走 http，
          # 于是每个请求都被 SecurityMiddleware 301 到 https，31 个视图测试一起挂成
          # "301 != 200/405"。这里关掉跳转、保留其余加固项（Cookie Secure、X-Frame-Options…），
          # 与 docker-build.yml 冒烟起容器时的 -e SECURE_SSL_REDIRECT=false 同一套约定。
          SECURE_SSL_REDIRECT: "false"

      - name: Install security linter
        run: pip install bandit

      - name: Run bandit security scan
        # v2.4: 静态扫描安全问题(medium 及以上),防新增高危代码
        # 跳过说明:
        #   B105=硬编码密码(测试用密码误报)
        #   B311=random(非密码学用途的 random 误报)
        #   B608=SQL 注入(本项目大量合法 SQL 拼接已用 safe_oracle_identifier/
        #         quote_identifier 保护,bandit 不识别安全函数会误报;
        #         SQL 注入防护靠 serializer 入口校验 + 运行时安全函数双重保障)
        run: bandit -r migration_app -x 'tests.py,migrations' -ll -s B105,B311,B608

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 与 Dockerfile 的 web-builder 阶段保持一致（corepack prepare pnpm@11.17.0）。
          # pnpm-workspace.yaml 里没有 packages: 字段，只有 pnpm 11 的 allowBuilds 配置；
          # pnpm 9 在加载配置阶段就报 "packages field missing or empty"，装不动也构建不了。
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          # Dockerfile 用的是 node:22-alpine，这里同版本，避免 CI 校验的运行时和镜像里的不是同一个
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
