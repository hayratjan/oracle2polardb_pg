[package]
name = "oracle2polardb-pg-desktop"
version = "2.5.0"
description = "Oracle 到 PolarDB-PG 迁移工具桌面客户端"
authors = ["hayratjan"]
edition = "2021"
rust-version = "1.77"

publish = false

[lib]
name = "oracle2polardb_pg_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
log = "0.4"
env_logger = "0.11"
url = "2"
which = "6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
