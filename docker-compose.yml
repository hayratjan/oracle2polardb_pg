# Oracle → PolarDB 迁移平台本地栈（Django + Redis + Celery Worker/Beat）
# v2.4: 修复生产配置(runserver→gunicorn, 设 DJANGO_ENV=prod, Redis 加密码, 加健康检查/restart)
# v2.4.4: 新增可选服务组——
#   · profile "meta-db"  : PostgreSQL 元数据库（DATABASE_URL 指向它，文档与实现终于一致）
# 启用方式: docker compose --profile meta-db up -d
#
# v2.5: 前后端合并为单镜像——Vue 构建产物打进镜像，由 Django + WhiteNoise 同源直出
#   (访问入口就是 8000，不再有 8080 的 nginx 前端服务，也不再需要 CORS)。
#   切 thick 变体(连 Oracle 11g 源库需要 Instant Client):
#     APP_TARGET=thick docker compose up -d --build
#   四个应用服务共用同一个 build 定义，改一处即全部生效。
x-app-build: &app-build
  context: .
  target: ${APP_TARGET:-thin}

services:
  redis:
    image: redis:7-alpine
    # v2.4: 不暴露公网,仅容器内网络可见;如需调试可注释解除
    expose:
      - "6379"
    # v2.4: 加密码(通过环境变量),防止未授权访问
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: *app-build
    # v2.4: 生产用 gunicorn,移除 runserver(性能差/不安全)
    # v2.5: 去掉启动期 collectstatic——镜像构建时已收集并生成 WhiteNoise 的 hash 清单，
    #       运行时再重做一遍是 1900 个文件的重处理(实测约 10s)，且与 gunicorn 读清单存在竞态。
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn oracle2polardb_pg.wsgi:application
             --bind 0.0.0.0:8000
             --workers ${GUNICORN_WORKERS:-2}
             --timeout 120
             --access-logfile -"
    ports:
      - "8000:8000"
    # v2.4.1: 通过 env_file 注入 DJANGO_SECRET_KEY/ALLOWED_HOSTS/MIGRATION_FERNET_KEY 等生产必填变量
    # 此前仅 environment 设了 DJANGO_ENV/CELERY_*,缺少 SECRET_KEY 等 → collectstatic 启动即崩溃
    env_file: .env
    environment:
      # v2.4: 强制生产模式,此前 DJANGO_DEBUG=true 但未设 DJANGO_ENV=prod
      # 导致 IS_DEV=True → ALLOWED_HOSTS=['*'] + Cookie Secure 不生效
      DJANGO_ENV: prod
      DJANGO_DEBUG: "false"
      # environment 优先级高于 env_file,此处显式覆盖 Celery 连接(指向 compose 内部 redis 服务)
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
    # v2.4: 生产不挂载源码卷(避免暴露 .env/.git);开发需调试可改为 volumes: - .:/app
    # volumes:
    #   - .:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # v2.4: 用 /healthz 端点做健康检查
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-worker:
    build: *app-build
    command: celery -A oracle2polardb_pg worker -l info
    env_file: .env
    environment:
      DJANGO_ENV: prod
      DJANGO_DEBUG: "false"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # v2.4.4: worker 存活检查（celery inspect ping）
      test: ["CMD", "celery", "-A", "oracle2polardb_pg", "inspect", "ping", "-d", "celery@$${HOSTNAME}"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  celery-beat:
    build: *app-build
    command: celery -A oracle2polardb_pg beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DJANGO_ENV: prod
      DJANGO_DEBUG: "false"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ═══ v2.4.4 可选:PostgreSQL 元数据库(profile: meta-db) ═══
  # 部署文档一直示例 DATABASE_URL=postgres://...@db:5432/... 但此前 compose 并无 db 服务。
  # 启用后 .env 设 DATABASE_URL=postgres://migration:migrationpass@db:5432/migration_meta
  db:
    image: postgres:16-alpine
    profiles: ["meta-db"]
    environment:
      POSTGRES_DB: migration_meta
      POSTGRES_USER: ${META_DB_USER:-migration}
      POSTGRES_PASSWORD: ${META_DB_PASSWORD:-changeme_metadb}
    volumes:
      - meta_db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${META_DB_USER:-migration} -d migration_meta"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  meta_db_data:
