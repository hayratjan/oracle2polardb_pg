# Oracle → PolarDB 迁移平台本地栈（Django + Redis + Celery Worker/Beat）
# v2.4: 修复生产配置(runserver→gunicorn, 设 DJANGO_ENV=prod, Redis 加密码, 加健康检查/restart)
services:
  redis:
    image: redis:7-alpine
    # v2.4: 不暴露公网,仅容器内网络可见;如需调试可注释解除
    expose:
      - "6379"
    # v2.4: 加密码(通过环境变量),防止未授权访问
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: .
    # v2.4: 生产用 gunicorn,移除 runserver(性能差/不安全)
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn oracle2polardb_pg.wsgi:application
             --bind 0.0.0.0:8000
             --workers ${GUNICORN_WORKERS:-2}
             --timeout 120
             --access-logfile -"
    ports:
      - "8000:8000"
    # v2.4.1: 通过 env_file 注入 DJANGO_SECRET_KEY/ALLOWED_HOSTS/MIGRATION_FERNET_KEY 等生产必填变量
    # 此前仅 environment 设了 DJANGO_ENV/CELERY_*,缺少 SECRET_KEY 等 → collectstatic 启动即崩溃
    env_file: .env
    environment:
      # v2.4: 强制生产模式,此前 DJANGO_DEBUG=true 但未设 DJANGO_ENV=prod
      # 导致 IS_DEV=True → ALLOWED_HOSTS=['*'] + Cookie Secure 不生效
      DJANGO_ENV: prod
      DJANGO_DEBUG: "false"
      # environment 优先级高于 env_file,此处显式覆盖 Celery 连接(指向 compose 内部 redis 服务)
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
    # v2.4: 生产不挂载源码卷(避免暴露 .env/.git);开发需调试可改为 volumes: - .:/app
    # volumes:
    #   - .:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # v2.4: 用 /healthz 端点做健康检查
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-worker:
    build: .
    command: celery -A oracle2polardb_pg worker -l info
    env_file: .env
    environment:
      DJANGO_ENV: prod
      DJANGO_DEBUG: "false"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A oracle2polardb_pg beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DJANGO_ENV: prod
      DJANGO_DEBUG: "false"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
